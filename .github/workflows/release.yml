name: release

permissions:
  contents: write

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Changelog
        run: |
          # 获取当前tag（如果是tag推送则移除refs/tags/前缀，否则使用最新tag）
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            CURRENT_TAG=$(echo "${{ github.ref }}" | sed 's|refs/tags/||')
            echo "Current tag from ref: $CURRENT_TAG"
          else
            # 如果不是tag推送，获取最新的tag
            CURRENT_TAG=$(git tag --sort=-version:refname | head -n 1)
            echo "Current tag from git: $CURRENT_TAG"
          fi

          # 获取上一个tag（按版本排序，排除当前tag）
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "$CURRENT_TAG" | head -n 1)
          echo "Previous tag: $PREVIOUS_TAG"

          # 验证当前tag是否存在
          if ! git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            echo "Error: Tag $CURRENT_TAG not found"
            exit 1
          fi

          # 如果有上一个tag，则生成changelog
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog from $PREVIOUS_TAG to $CURRENT_TAG"
            npx changelogithub --from "$PREVIOUS_TAG" --to "$CURRENT_TAG"
          else
            echo "No previous tag found, generating changelog from first commit"
            npx changelogithub --from "$(git rev-list --max-parents=0 HEAD)" --to "$CURRENT_TAG"
          fi
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: PNPM build lib
        run: pnpm build:lib

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
